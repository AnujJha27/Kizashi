name: Curriculum CI

on:
  push:
    branches:
      - "curriculum/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize checked-in staged package for QA tests
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          source = Path('data/staging/kizashi-n5-source-review.json.gz')
          target = Path('data/staging/kizashi-n5-source-review.json')
          if source.exists() and not target.exists():
              with gzip.open(source, 'rb') as src, target.open('wb') as dst:
                  dst.write(src.read())
          PY
      - run: node scripts/build_syllabus_audit.mjs --check
      - name: Report unresolved grammar teaching mappings
        run: node scripts/report_grammar_teaching_gaps.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
