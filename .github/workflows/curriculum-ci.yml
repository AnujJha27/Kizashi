name: Curriculum CI

on:
  push:
    branches:
      - "curriculum/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build_syllabus_audit.mjs --check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
